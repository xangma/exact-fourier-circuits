[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-fourier-circuits"
version = "0.1.0"
description = "Exact Fourier circuit verification and lazy finite-win construction"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
cuda = ["cupy-cuda12x==13.3.0", "mpmath==1.3.0"]

[project.scripts]
exact-fourier = "exact_fourier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
